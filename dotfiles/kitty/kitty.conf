include tokyo-night.conf
include dank-tabs.conf

# Font
font_family Maple Mono NF CN
bold_font auto
italic_font auto
bold_italic_font auto
font_size        12.0
adjust_line_height 115%
adjust_baseline 3

# Window
# tiling WM 下不需要 kitty 记住窗口尺寸：否则上次退出若是最大化状态，
# kitty 会向 niri 请求 set_maximized，新终端就会被撑成全宽。
remember_window_size no
window_padding_width 16
window_padding_height 16
hide_window_decorations yes
show_window_resize_notification no
confirm_os_window_close 0

# Keybindings
map F11 toggle_fullscreen

# Single instance without allowing applications to control terminal windows.
single_instance yes
allow_remote_control no

# Aesthetics
cursor_shape block
cursor_beam_thickness 1.5
enable_audio_bell no
repaint_delay 6
input_delay 3

# Tab bar
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
tab_bar_min_tabs            1

# Scrollback
scrollback_lines 10000
scrollback_pager_history_size 100

# URL
url_style curly
open_url_with default
detect_urls yes

# Select-to-copy (release mouse → clipboard), like OpenCode TUI
copy_on_select clipboard
strip_trailing_spaces smart

# Left-click opens URL without Shift (also when a TUI has grabbed the mouse)
# selection first: if you just selected text, click won't open a link under it
mouse_map left click ungrabbed,grabbed mouse_handle_click selection link prompt
